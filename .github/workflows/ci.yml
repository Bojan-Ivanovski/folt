name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - name: Check out source and PR history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The planner also fetches the exact event base SHA after checkout.
          fetch-depth: 0
      - name: Decide whether to skip the build
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci-plan.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Preserve line endings
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install SQLite build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes build-essential
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Show toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Lint all test suites
        run: cargo clippy --locked --workspace --test '*' -- -D warnings
      - name: Build
        run: cargo build --locked --workspace
      - name: Run workspace tests and doctests
        run: cargo test --locked --workspace
      - name: Run PR tests
        run: cargo test-pr --locked
      - name: Smoke check performance suite
        run: cargo test-performance --test

  msrv:
    name: MSRV (1.89)
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preserve line endings
        run: git config --global core.autocrlf false
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.89 --profile minimal
      - name: Check MSRV
        run: cargo +1.89 check --locked --workspace --all-targets

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [plan, verify, msrv]
    if: always()
    steps:
      - name: Require all checks to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          test "$PLAN_RESULT" = success || exit 1
          for result in "$VERIFY_RESULT" "$MSRV_RESULT"; do
            if [ "$result" = success ]; then
              continue
            fi
            test "$SKIP" = true && test "$result" = skipped || exit 1
          done
